[project]
name = "call-copilot"
version = "0.4.3"
description = "Call Copilot — silently record meeting audio in the background, then transcribe locally to clean markdown."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Anisur Rahman", email = "pshakilwizard@gmail.com" },
]
keywords = ["audio", "transcription", "whisper", "meeting", "recorder", "macos", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Runtime requirement: macOS 14.2+ (Core Audio process taps). pip can't enforce
# an OS floor, so this is documented in the classifiers + checked at runtime by
# `rec` itself (see src/rec/envcheck.py) with a clean, actionable message.
dependencies = [
    "click>=8.1",
    "audiotap>=0.0.2",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    # MCP server (the `rec mcp` command — exposes transcripts to Claude Code
    # and any other MCP client over stdio). Pinned to the v2 line: the SDK API
    # we use (from mcp.server import MCPServer) landed in 2.0.
    "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/AnisurRahmann/call-copilot"
Repository = "https://github.com/AnisurRahmann/call-copilot"
Issues = "https://github.com/AnisurRahmann/call-copilot/issues"
Changelog = "https://github.com/AnisurRahmann/call-copilot/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.6",
]

[project.scripts]
rec = "rec.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the single-file browser UI in the wheel + sdist. Without this, `rec web`
# installs fine and 404s on `/` — the Homebrew formula builds from the sdist,
# so the static file must be declared here, not relied on by "it works locally".
[tool.setuptools.package-data]
"rec.web" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# A focused, achievable baseline. The full default rule set (which includes
# bandit-style S, timezone DTZ, and exception-message TRY rules) is aspirational
# and not yet clean across the tree; tighten this as the codebase catches up.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names — real bugs)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern syntax)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length handled by line-length + formatter, not enforced per-line
]
