name: Release

# Publishes to PyPI when a `v*` tag is pushed. Uses PyPI Trusted Publishing
# (OIDC) — no API token stored in repo secrets. Configure the trusted publisher
# once on PyPI (see docs/HOMEBREW.md / repo settings):
#   PyPI project → Publishing → Add a publisher
#     Environment: release
#     Workflow:    .github/workflows/release.yml
#     GitHub repo: AnisurRahmann/call-copilot

on:
  push:
    tags:
      - "v*"

# One release at a time per tag; never cancel a publish mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The OIDC token needs these permissions to be issued by GitHub.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: macos-latest
    # Trusted Publishing scopes the publish to this environment name; it must
    # match the environment configured on the PyPI project.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Run the test suite on the exact tag we're publishing, so a broken
      # release can never reach PyPI. Install with dev extras for pytest/ruff.
      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build sdist + wheel
        run: python -m build

      # A quick sanity check that the just-built wheel installs cleanly and the
      # console script is present — catches packaging regressions before upload.
      - name: Verify the wheel installs and exposes `rec`
        run: |
          pip install --force-reinstall dist/*.whl
          rec --version

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted Publishing: no password/token. pypa/gh-action-pypi-publish
      # exchanges the OIDC token issued by GitHub for a short-lived PyPI upload
      # credential scoped to this exact workflow + environment.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # `skip-existing` avoids a hard failure if the same version is
          # re-pushed (e.g. re-running a partially-failed release). PyPI never
          # overwrites a file — it just skips the duplicate.
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
